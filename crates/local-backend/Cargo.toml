[package]
name = "vertebrae-local-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
vertebrae-core = { path = "../core" }
vertebrae-installer = { path = "../installer" }

libsql = { version = "0.2", features = ["core"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

[lints]
workspace = true
